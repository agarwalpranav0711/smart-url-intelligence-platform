name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/url_shortener
  NODE_ENV: test

jobs:
  ci-pipeline:
    name: Full-Stack CI Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Setup PostgreSQL Schema & Database
        run: npm run setup-db

      - name: Run Backend Integration Tests
        run: npm test

      - name: OpenAPI Specification Contract Verification
        run: node test/step25-openapi-docs.test.js

      - name: Run Frontend Unit & Component Tests
        run: |
          cd frontend
          npm test -- --run

      - name: Run Frontend TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Install Playwright Browsers & Dependencies
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          cd frontend
          npx playwright test

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Security Vulnerability Audit
        run: |
          npm audit --audit-level=high
          cd frontend
          npm audit --audit-level=high

      - name: Build Docker Container Image
        run: docker build -t tinyurl-app:latest .
